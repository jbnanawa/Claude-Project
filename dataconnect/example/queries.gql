mutation CreateUser @auth(level: USER) {
  user_insert(data: {
    email: "user@example.com",
    createdAt_expr: "request.time"
  })
}

mutation UpdateMyUser($displayName: String) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { displayName: $displayName })
}

mutation DeleteMyUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetMyUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    email
    displayName
  }
}

query ListAllUsers @auth(level: PUBLIC, insecureReason: "Publicly listing user display names for community directory") {
  users {
    displayName
  }
}

mutation CreateEntry($content: String!) @auth(level: USER) {
  entry_insert(data: {
    content: $content,
    createdAt_expr: "request.time",
    userId_expr: "auth.uid"
  })
}

mutation UpdateEntry($id: UUID!, $isFavorite: Boolean) @auth(level: USER) {
  entry_update(id: $id, data: { isFavorite: $isFavorite })
}

mutation DeleteEntry($id: UUID!) @auth(level: USER) {
  entry_delete(id: $id)
}

query GetEntry($id: UUID!) @auth(level: USER) {
  entry(id: $id) {
    content
    isFavorite
  }
}

query ListMyEntries @auth(level: USER) {
  entries(where: { userId: { eq_expr: "auth.uid" } }) {
    content
    createdAt
  }
}

mutation CreateTag($name: String!) @auth(level: USER) {
  tag_insert(data: {
    name: $name,
    userId_expr: "auth.uid"
  })
}

mutation UpdateTag($id: UUID!, $name: String!) @auth(level: USER) {
  tag_update(id: $id, data: { name: $name })
}

mutation DeleteTag($id: UUID!) @auth(level: USER) {
  tag_delete(id: $id)
}

query GetTag($id: UUID!) @auth(level: USER) {
  tag(id: $id) {
    name
  }
}

query ListMyTags @auth(level: USER) {
  tags(where: { userId: { eq_expr: "auth.uid" } }) {
    name
  }
}

mutation LinkEntryToTag($entryId: UUID!, $tagId: UUID!) @auth(level: USER) {
  entryTag_insert(data: { entryId: $entryId, tagId: $tagId })
}

mutation RemoveEntryTag($entryId: UUID!, $tagId: UUID!) @auth(level: USER) {
  entryTag_delete(key: { entryId: $entryId, tagId: $tagId })
}

query ListEntryTags @auth(level: USER) {
  entryTags {
    entry { content }
    tag { name }
  }
}

mutation CreateReminder($time: String!, $isEnabled: Boolean!) @auth(level: USER) {
  reminder_insert(data: {
    time: $time,
    isEnabled: $isEnabled,
    userId_expr: "auth.uid"
  })
}

mutation UpdateReminder($id: UUID!, $isEnabled: Boolean!) @auth(level: USER) {
  reminder_update(id: $id, data: { isEnabled: $isEnabled })
}

mutation DeleteReminder($id: UUID!) @auth(level: USER) {
  reminder_delete(id: $id)
}

query GetReminder($id: UUID!) @auth(level: USER) {
  reminder(id: $id) {
    time
    isEnabled
  }
}

query ListMyReminders @auth(level: USER) {
  reminders(where: { userId: { eq_expr: "auth.uid" } }) {
    time
    isEnabled
  }
}