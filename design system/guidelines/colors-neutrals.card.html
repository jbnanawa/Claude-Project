<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1}.chip{height:66px;border-radius:14px;border:1px solid rgba(61,50,48,.08)}.n{font-size:12px;font-weight:600;color:var(--text-primary);margin-top:8px}.t{font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--gw-cream)"></div><div class="n">Cream</div><div class="t">--gw-cream</div></div>
<div class="sw"><div class="chip" style="background:var(--gw-cream-2)"></div><div class="n">Cream 2</div><div class="t">--gw-cream-2</div></div>
<div class="sw"><div class="chip" style="background:var(--gw-blush)"></div><div class="n">Blush</div><div class="t">--gw-blush · hairlines</div></div>
<div class="sw"><div class="chip" style="background:var(--gw-ink-2)"></div><div class="n">Ink 2</div><div class="t">--gw-ink-2 · body</div></div>
<div class="sw"><div class="chip" style="background:var(--gw-ink)"></div><div class="n">Ink</div><div class="t">--gw-ink · headings</div></div>
</div></body></html>
