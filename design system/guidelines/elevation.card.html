<!-- @dsCard group="Brand" viewport="700x220" name="Glass card & elevation" subtitle="The translucent card recipe + soft cocoa shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-page);font-family:var(--font-sans)}.card{border-radius:24px;background:var(--glass-fill);border:1px solid var(--border-glass);box-shadow:var(--shadow-card);backdrop-filter:blur(20px);padding:24px;position:relative;overflow:hidden;max-width:520px}.blob{position:absolute;border-radius:50%}h3{font-family:var(--font-serif);font-size:24px;letter-spacing:-.5px;color:var(--gw-ink);margin:0 0 6px}p{font-size:14px;line-height:22px;color:var(--text-secondary);margin:0}.t{font-size:11px;color:var(--text-muted);margin-top:14px}</style>
</head><body>
<div class="card">
<div style="position:relative">
<h3>A little reminder for you</h3>
<p>Glass fill · 1px white hairline · <code>0 8px 32px rgba(61,50,48,.08)</code> plus inset highlights.</p>
<div class="t">--glass-fill · --border-glass · --shadow-card · radius 24</div>
</div>
</div>
</body></html>
