<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>*{margin:0;box-sizing:border-box}html,body{width:1280px;height:854px}
.wrap{width:1280px;height:854px;display:flex}
.main{width:960px;height:854px;background:var(--surface-page);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.tile{width:150px;height:150px;border-radius:36px;display:grid;place-items:center;background:var(--gw-amber-soft);color:var(--gw-amber);font-family:var(--font-sans);font-weight:600;font-size:78px}
.name{font-family:var(--font-serif);font-size:82px;letter-spacing:-1.5px;color:var(--gw-ink)}
.strip{width:320px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="wrap">
<div class="main">
<div class="tile">Gw</div>
<div class="name">Glow Within</div>
</div>
<div class="strip">
<div style="background:var(--gw-sage)"></div>
<div style="background:var(--gw-green)"></div>
<div style="background:var(--gw-amber)"></div>
<div style="background:var(--gw-ink)"></div>
</div>
</div>
</body></html>
